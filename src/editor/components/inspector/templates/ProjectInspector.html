<!-- ProjectInspector.html — Chapter card markup -->
<!-- Used by: ProjectInspector.template.ts / ProjectInspector.ts -->
<!-- Slots: {{lockHeaderHTML}}, {{idx}}, {{title}}, {{id}}, {{description}} -->
{{lockHeaderHTML}}
<div class="sidebar-section">
  <div class="form-group">
    <label>Chapter Title</label>
    <input type="text" class="form-input ch-title" data-idx="{{idx}}" value="{{title}}" style="font-weight:700;" />
  </div>
  <div class="form-group">
    <label>Chapter ID</label>
    <input type="text" class="form-input" value="{{id}}" readonly style="opacity:0.7;" />
  </div>
  <div class="form-group">
    <label>Description</label>
    <textarea class="form-input ch-desc" data-idx="{{idx}}" style="height:60px;">{{description}}</textarea>
  </div>
</div>
