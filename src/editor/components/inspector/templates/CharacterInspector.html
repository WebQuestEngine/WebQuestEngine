<!-- CharacterInspector.html — Character properties tab -->
<!-- Used by: EntityInspectors.template.ts -->
<!-- Slots: {{cIdx}}, {{name}}, {{thumbnailHTML}}, {{spriteSheetUrl}},
            {{posX}}, {{posY}}, {{scale}}, {{speed}}, {{spritesheetrows}}, {{spritesheetcols}},
            {{depthY}}, {{animationsHTML}} -->
<div class="sidebar-section">
  <div class="form-group">
    <label>Character Name</label>
    <input type="text" class="form-input char-name" data-idx="{{cIdx}}" value="{{name}}" style="font-weight:700;" />
  </div>
  <div class="form-group">
    <label>Sprite Sheet Path / Upload</label>
    <div style="display:flex; gap:8px; align-items:center;">
      {{thumbnailHTML}}
      <input type="text" class="form-input char-spritesheet" data-idx="{{cIdx}}" value="{{spriteSheetUrl}}"
        style="flex:1;" />
      <label class="btn btn-primary" style="padding:6px 10px; cursor:pointer;">
        📁
        <input type="file" class="char-file-input" data-idx="{{cIdx}}" accept="image/*" style="display:none;" />
      </label>
    </div>
  </div>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
    <div>
      <label style="font-size:0.65rem; color:var(--text-muted);">Position X</label>
      <input type="number" class="form-input char-pos-x" data-idx="{{cIdx}}" value="{{posX}}" />
    </div>
    <div>
      <label style="font-size:0.65rem; color:var(--text-muted);">Position Y</label>
      <input type="number" class="form-input char-pos-y" data-idx="{{cIdx}}" value="{{posY}}" />
    </div>
    <div>
      <label style="font-size:0.65rem; color:var(--text-muted);">Scale</label>
      <input type="number" step="0.05" class="form-input char-scale" data-idx="{{cIdx}}" value="{{scale}}" />
    </div>
    <div>
      <label style="font-size:0.65rem; color:var(--text-muted);">Speed</label>
      <input type="number" class="form-input char-speed" data-idx="{{cIdx}}" value="{{speed}}" />
    </div>
    <div>
      <label style="font-size:0.65rem; color:var(--text-muted);">Rows</label>
      <input type="number" class="form-input char-fw" data-idx="{{cIdx}}" value="{{spritesheetRows}}" />
    </div>
    <div>
      <label style="font-size:0.65rem; color:var(--text-muted);">Columns</label>
      <input type="number" class="form-input char-fh" data-idx="{{cIdx}}" value="{{spritesheetCols}}" />
    </div>
    <div style="grid-column: span 2;">
      <label style="font-size:0.65rem; color:#06b6d4; font-weight:700;">Depth Y / Z-Sort (Leave empty for Auto Feet
        Y)</label>
      <input type="number" class="form-input char-depth-y" data-idx="{{cIdx}}" value="{{depthY}}"
        placeholder="Auto (Feet Y)" />
    </div>
  </div>
</div>
<div class="sidebar-section">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
    <div class="sidebar-section-title" style="margin-bottom:0;">🎬 Sprite Sheet Animation Clips ({{animCount}})</div>
    <button class="btn btn-primary btn-add-char-anim" data-idx="{{cIdx}}" style="font-size:0.7rem; padding:3px 6px;">+
      Add Clip</button>
  </div>
  {{animationsHTML}}
</div>
