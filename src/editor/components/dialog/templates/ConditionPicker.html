<div class="unified-condition-box"
  style="display:flex; gap:5px; align-items:center; background:rgba(0,0,0,0.25); padding:3px 6px; border-radius:5px; border:1px solid rgba(255,255,255,0.06); margin-bottom:4px;">
  <span style="font-size:0.65rem; color:var(--text-muted);">If</span>
  <input type="text" class="form-input {{nameClass}}" data-nodeid="{{nodeId}}" {{cidxAttr}} value="{{currentFlag}}"
    placeholder="flagName" style="flex:1; font-size:0.7rem; font-weight:600; color:#38bdf8; {{opacityStyle}}"
    {{disabledAttr}} />
  <span style="font-size:0.65rem; color:var(--text-muted);">is</span>
  <select class="form-input {{opClass}}" data-nodeid="{{nodeId}}" {{cidxAttr}}
    style="width:115px; font-size:0.65rem; font-weight:700; color:{{opColor}};">
    {{optionsHtml}}
  </select>
</div>
