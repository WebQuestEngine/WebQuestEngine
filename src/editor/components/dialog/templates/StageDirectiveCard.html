<div class="stage-directive-card" data-nodeid="{{nodeId}}" data-didx="{{dIdx}}" draggable="true" style="position:relative; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.08); padding:6px; border-radius:6px; cursor:grab;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
    <div style="display:flex; gap:4px; align-items:center;">
      <span class="choice-drag-handle" style="cursor:grab; color:var(--text-muted); font-size:0.85rem; font-weight:800; user-select:none; padding-right:2px;" title="Drag & drop to re-order directive">⠿</span>
      <select class="form-input dir-type-select" data-nodeid="{{nodeId}}" data-didx="{{dIdx}}" style="font-size:0.7rem; font-weight:700; color:#38bdf8; padding:2px 4px;">
        <option value="animation" {{typeAnimSelected}}>🎬 Actor Animation</option>
        <option value="choreography_group" {{typeChoreoSelected}}>👥 Choreography Group</option>
        <option value="give_item" {{typeGiveSelected}}>🎁 Give Item</option>
        <option value="take_item" {{typeTakeSelected}}>🎒 Take Item</option>
        <option value="emote" {{typeEmoteSelected}}>💬 Emote Bubble</option>
        <option value="look_at" {{typeLookAtSelected}}>👀 Face / Turn To</option>
        <option value="walk_to" {{typeWalkToSelected}}>🚶 Walk To</option>
        <option value="sfx" {{typeSfxSelected}}>🔊 Audio SFX</option>
        <option value="camera" {{typeCameraSelected}}>🎥 Camera Action</option>
        <option value="custom_event" {{typeEventSelected}}>⚡ Custom Event</option>
      </select>
    </div>
    <div style="display:flex; align-items:center; gap:4px;">
      <span style="font-size:0.6rem; color:var(--text-muted);">⏱️ Delay:</span>
      <input type="number" step="0.1" class="form-input dir-delay-input" data-nodeid="{{nodeId}}" data-didx="{{dIdx}}" value="{{delaySeconds}}" style="width:44px; font-size:0.65rem; padding:1px 3px;" title="Delay offset in seconds" />
      <button class="btn btn-del-directive" data-nodeid="{{nodeId}}" data-didx="{{dIdx}}" style="padding:1px 4px; font-size:0.6rem; color:#ef4444;" title="Delete Directive">✕</button>
    </div>
  </div>

  <!-- Dynamic fields based on directive type -->
  {{directiveBodyHtml}}
</div>
